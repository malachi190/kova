name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Install pnpm
        run: |
          corepack prepare pnpm@11.28.11 --activate
          corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated migration-test PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          docker run --detach --rm \
            --name kova-ci-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD="${password}" \
            postgres:17.6-alpine
          for attempt in {1..30}; do
            if docker exec kova-ci-postgres pg_isready -U postgres -d postgres; then
              break
            fi
            sleep 2
          done
          docker exec kova-ci-postgres pg_isready -U postgres -d postgres
          echo "TEST_DATABASE_ADMIN_URL=postgresql://postgres:${password}@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and migration tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Build application image
        run: docker build --tag kova:ci .
