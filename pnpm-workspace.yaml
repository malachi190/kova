overrides:
  # Keep the migration CLI's legacy loader on a patched compatible esbuild.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  '@nestjs/platform-express>multer': 2.5.0
  '@typescript-eslint/typescript-estree>minimatch': 11.0.1
  # Keep vulnerable test-only glob/minimatch trees on patched releases.
  glob: 14.0.2
  minimatch: 11.0.1
# Drizzle Kit's TypeScript config loader requires esbuild's install script.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  cpu-features: false
  protobufjs: false
  ssh2: false
