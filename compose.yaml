name: kova

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${COMPOSE_POSTGRES_DB:-kova_dev}
      POSTGRES_USER: ${COMPOSE_POSTGRES_USER:-kova_app}
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${COMPOSE_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${COMPOSE_REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.1.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${COMPOSE_RABBITMQ_USER:-kova_app}
      RABBITMQ_DEFAULT_PASS: ${COMPOSE_RABBITMQ_PASSWORD}
    ports:
      - '127.0.0.1:${COMPOSE_RABBITMQ_PORT:-5673}:5672'
      - '127.0.0.1:${COMPOSE_RABBITMQ_MANAGEMENT_PORT:-15673}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
